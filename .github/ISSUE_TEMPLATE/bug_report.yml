name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: "@ix-xs/twitch.api version"
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: "Node.js 22.x, Bun 1.x, Cloudflare Workers..."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include the error class and its message.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows the problem. Remove every token and secret.
      render: ts
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Remove every token and secret.
      render: shell
